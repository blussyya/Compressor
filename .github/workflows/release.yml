name: Build & Release APK

on:
  # Push a tag like v1.0.0 to build the APK and publish it as a GitHub Release
  # under that tag.
  push:
    tags:
      - "v*"
  # Or trigger manually from the Actions tab any time you just want a fresh
  # build cut as a Release, without pushing a tag yourself.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Decodes the SQUISH_KEYSTORE_BASE64 secret (if set) into a file and points
      # app/build.gradle.kts's signing config at it. No secret configured yet →
      # SQUISH_KEYSTORE_PATH stays empty and the build below falls back to an
      # unsigned/debug build, so this workflow keeps working before you set them up.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SQUISH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/squish-release.jks"
            echo "SQUISH_KEYSTORE_PATH=$RUNNER_TEMP/squish-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          SQUISH_KEYSTORE_PASSWORD: ${{ secrets.SQUISH_KEYSTORE_PASSWORD }}
          SQUISH_KEY_ALIAS: ${{ secrets.SQUISH_KEY_ALIAS }}
          SQUISH_KEY_PASSWORD: ${{ secrets.SQUISH_KEY_PASSWORD }}
        run: |
          if [ -n "$SQUISH_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease --no-daemon
            echo "APK_SRC=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            ./gradlew assembleDebug --no-daemon
            echo "APK_SRC=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage APK
        run: |
          mkdir -p dist
          name="squish-${{ steps.tag.outputs.tag }}.apk"
          cp "$APK_SRC" "dist/$name"
          echo "APK_PATH=dist/$name" >> "$GITHUB_ENV"

      # Always publish a Release with the APK attached — on a real version tag
      # it's a normal release; on a manual run it's tagged build-<run number>
      # so repeated manual runs don't collide.
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
